name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    # 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Setup Java
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    # 3. Build project
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # 4. Build Docker image
    - name: Build Docker image
      run: docker build -t springboot-jpa .

    # 5. Run container (for testing)
    - name: Run container
      run: docker run -d -p 8080:8080 springboot-jpa
